name: Telegram repository notifications

on:
  push:
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]
  issues:
    types: [opened, reopened, closed]
  release:
    types: [published]
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify Telegram subscribers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_NOTIFIER_URL: ${{ vars.GITHUB_NOTIFIER_URL }}
          GITHUB_NOTIFIER_SECRET: ${{ secrets.GITHUB_NOTIFIER_SECRET }}
        run: python3 .github/scripts/notify_telegram.py
