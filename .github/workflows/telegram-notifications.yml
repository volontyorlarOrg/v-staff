name: Telegram repository notifications

on:
  push:
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
  issues:
    types: [opened, reopened, closed]
  release:
    types: [published]
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_API_TOKEN: ${{ github.token }}
      GITHUB_NOTIFIER_URL: ${{ vars.GITHUB_NOTIFIER_URL }}
      GITHUB_NOTIFIER_SECRET: ${{ secrets.GITHUB_NOTIFIER_SECRET }}
    steps:
      - name: Validate Telegram configuration
        shell: bash
        run: |
          if [ -n "$GITHUB_NOTIFIER_URL" ] || [ -n "$GITHUB_NOTIFIER_SECRET" ]; then
            if [ -z "$GITHUB_NOTIFIER_URL" ] || [ -z "$GITHUB_NOTIFIER_SECRET" ]; then
              echo "::error::Set both GITHUB_NOTIFIER_URL and GITHUB_NOTIFIER_SECRET to enable subscriber broadcasting."
              exit 1
            fi
          else
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "::error::Configure GITHUB_NOTIFIER_URL and GITHUB_NOTIFIER_SECRET for subscribers, or TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID for one chat."
              exit 1
            fi
          fi

      - name: Send notification
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          kind = os.environ["GITHUB_EVENT_NAME"]
          action = event.get("action", "")
          repo = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ["GITHUB_ACTOR"]
          url = event.get("repository", {}).get("html_url", "https://github.com/" + repo)
          detail = ""

          if kind in ("push", "workflow_dispatch"):
              # On a manual run GITHUB_SHA is the latest commit on the selected branch.
              # On a push, 'after' is the commit that was just pushed.
              sha = (event.get("after") if kind == "push" else None) or os.environ["GITHUB_SHA"]
              if sha == "0" * 40:
                  raise SystemExit("No commit to report for this event")

              commit_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{sha}",
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_API_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(commit_request, timeout=15) as response:
                      commit = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"Cannot load GitHub commit {sha[:7]} (HTTP {exc.code})"
                  ) from None

              branch = os.environ.get("GITHUB_REF_NAME", "unknown")
              commit_message = commit["commit"]["message"].splitlines()[0]
              author = (commit.get("author") or {}).get("login") or (
                  commit.get("commit", {}).get("author", {}).get("name")
              ) or actor
              changed = [item["filename"] for item in commit.get("files", [])]
              file_list = ", ".join(changed[:5])
              if len(changed) > 5:
                  file_list += f" (+{len(changed) - 5} more)"
              if not file_list:
                  file_list = "File list unavailable"

              label = "Manual latest-commit check" if kind == "workflow_dispatch" else "New code push"
              detail = (
                  f"{label}\n"
                  f"Branch: {branch}\n"
                  f"Commit: {sha[:7]}\n"
                  f"Author: {author}\n"
                  f"Message: {commit_message}\n"
                  f"Changed files: {file_list}"
              )
              url = commit.get("html_url") or f"https://github.com/{repo}/commit/{sha}"
          elif kind == "pull_request":
              pr = event["pull_request"]
              status = "merged" if action == "closed" and pr.get("merged") else action
              detail = f"PR #{pr['number']} {status}: {pr['title']}"
              url = pr["html_url"]
          elif kind == "issues":
              issue = event["issue"]
              detail = f"Issue #{issue['number']} {action}: {issue['title']}"
              url = issue["html_url"]
          elif kind == "release":
              release = event["release"]
              detail = f"Release published: {release.get('tag_name', '')}"
              url = release["html_url"]
          elif kind in ("create", "delete"):
              verb = "created" if kind == "create" else "deleted"
              detail = f"{event.get('ref_type', 'ref')} {event.get('ref', '')} {verb}"
          else:
              detail = f"Repository event: {kind}"

          message = f"GitHub update\nRepository: {repo}\nTriggered by: {actor}\n{detail}\n{url}"

          notifier_url = os.environ.get("GITHUB_NOTIFIER_URL", "").rstrip("/")
          notifier_secret = os.environ.get("GITHUB_NOTIFIER_SECRET", "")

          if notifier_url and notifier_secret:
              if not notifier_url.startswith("https://"):
                  raise SystemExit("GITHUB_NOTIFIER_URL must be HTTPS")
              broadcast_request = urllib.request.Request(
                  notifier_url + "/integrations/github-notifier/broadcast",
                  data=json.dumps({
                      "repository": repo,
                      "message": message[:3500],
                  }).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-github-notifier-secret": notifier_secret,
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(broadcast_request, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"Broadcast service error (HTTP {exc.code}). Check backend deployment and secret."
                  ) from None
              except urllib.error.URLError:
                  raise SystemExit("Cannot reach subscriber broadcasting backend") from None
              if result.get("failed"):
                  raise SystemExit(
                      f"Broadcast failed for {result['failed']} of {result['subscribers']} subscribers"
                  )
              print(f"Broadcast sent to {result.get('sent', 0)} subscribers")
          else:
              # Supports either one chat ID or comma-separated private/group chat IDs.
              chat_ids = [c.strip() for c in os.environ["TELEGRAM_CHAT_ID"].split(",") if c.strip()]
              if not chat_ids:
                  raise SystemExit("No Telegram chat IDs configured")
    
              for chat_id in chat_ids:
                  data = urllib.parse.urlencode({
                      "chat_id": chat_id,
                      "text": message[:4096],
                      "disable_web_page_preview": "true",
                  }).encode("utf-8")
                  request = urllib.request.Request(
                      f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                      data=data,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          result = json.load(response)
                  except urllib.error.HTTPError as exc:
                      try:
                          description = json.loads(exc.read().decode()).get("description", "Unknown error")
                      except (ValueError, UnicodeDecodeError):
                          description = "Unknown error"
                      raise SystemExit(f"Telegram API error (HTTP {exc.code}): {description}") from None
                  except urllib.error.URLError:
                      raise SystemExit("Cannot connect to Telegram API") from None
                  if not result.get("ok"):
                      raise SystemExit("Telegram rejected the notification")
                  print("Telegram notification sent to configured chat.")
          PY